name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  check-test:
    name: Check prior test run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tagged commit
        id: commit
        run: echo "commit=$(git rev-list -n 1 "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Require successful Test workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          count="$(gh run list \
            --workflow test.yml \
            --commit "$COMMIT" \
            --status success \
            --json databaseId \
            --jq 'length')"
          if [[ "$count" == "0" ]]; then
            echo "No successful Test workflow run found for commit ${COMMIT}."
            exit 1
          fi
          echo "Found ${count} successful Test workflow run(s) for commit ${COMMIT}."

  release:
    name: GoReleaser
    needs: check-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
